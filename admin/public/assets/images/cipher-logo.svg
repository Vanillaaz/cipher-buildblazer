<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Linear Gradient for CIPHER Text Glow -->
    <linearGradient id="cipherGreenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00CC52" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Cyberpunk Bracket Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagonal Shield Frame -->
    <polygon points="12,0 48,0 60,12 60,48 48,60 12,60 0,48 0,12" fill="#050806" stroke="#00FF66" stroke-width="2" filter="url(#neonGlow)" />
    <!-- Inner Matrix Circuit Grid -->
    <path d="M 12 18 L 30 18 L 38 26 L 48 26" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 18 42 L 30 42 L 36 36 L 48 36" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <!-- Center Glowing Node -->
    <circle cx="30" cy="30" r="5" fill="#00FF66" filter="url(#neonGlow)" />
    <circle cx="30" cy="30" r="2" fill="#080C0A" />
    <!-- Corner Nodes -->
    <circle cx="12" cy="18" r="2" fill="#00FF66" />
    <circle cx="48" cy="26" r="2" fill="#00FF66" />
    <circle cx="18" cy="42" r="2" fill="#00FF66" />
    <circle cx="48" cy="36" r="2" fill="#00FF66" />
  </g>

  <!-- CIPHER Brand Text -->
  <text x="82" y="44" font-family="'Space Grotesk', 'JetBrains Mono', system-ui, sans-serif" font-weight="900" font-size="34" fill="url(#cipherGreenGlow)" letter-spacing="4" filter="url(#neonGlow)">
    CIPHER
  </text>

  <!-- SJEC Department Subtitle -->
  <text x="84" y="60" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="2.5" opacity="0.9">
    // CSE ASSOCIATION • SJEC
  </text>

  <!-- Decorative Matrix Code Bracket -->
  <path d="M 285 22 L 295 22 L 295 58 L 285 58" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6" />
</svg>
